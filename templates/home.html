<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora para compra de carro</title>
    </head>

    <body>
        <div class="form-grid">
            <div class="input-group">
                <label>NOME DO CARRO <span class="req">*</span></label>
                <input type="text" id="nomeCarro" placeholder="Digite o nome de algum carro" autocomplete="off">
            </div>

            <div class="input-juros">
                <label>VALOR DO JUROS (% a.m.) <span class="req">*</span></label>
                <input type="number" id="valorJuros" placeholder="Ex: 1.8" step="0.01">
            </div>

            <div class="input-entrada">
                <label>VALOR DE ENTRADA (R$) <span class="opt">(opcional)</span></label>
                <input type="number" id="valorEntrada" placeholder="Ex: 10.000" step="0.01">
            </div>

            <button class="btn-calcular" onclick="abrirModalMeses()">CALCULAR</button>
        </div>
    </body>
</html>
